[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehai"
version = "1.0.0"
description = "Measuring and reducing individual prediction instability in ensemble diabetes risk models (BRFSS)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahul Kumar" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
